name: Python package

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest supported, Python and pandoc together
        include:
          - python-version: "3.10"
            pandoc-version: "3.1.1"
          - python-version: "3.13"
            # empty: the latest release
            pandoc-version: ""
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: pandoc/actions/setup@v1
      with:
        version: ${{ matrix.pandoc-version }}
    - name: Install
      run: pip install -e '.[extras,tests]'
    - name: Sanity check
      run: |
        pip check
        python -c 'import pannb'
        pandoc --version
    - name: Tests
      run: |
        make test
        coverage xml
